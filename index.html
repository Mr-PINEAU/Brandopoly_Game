<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes Chance</title>
  <style>
:root {
  --blue-bar: #2f6be8;
  --easy: #1f4cff;
  --medium: #d3c93f;
  --difficult: #8a3fc0;
  --btn: #18d9ff;
  --ink: #111;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { min-height: 100vh; height: 100vh; }
body {
  font-family: "Inter", system-ui, sans-serif;
  color: #fff;
  background: radial-gradient(ellipse at 80% 20%, #1f6a8f 0%, #263c75 45%, #1f5a80 100%);
  display: flex; flex-direction: column;
  width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
}

/* Barre du haut */
.topbar {
  background: var(--blue-bar);
  border-radius: 0 0 36px 36px;
  padding: 8px 0 12px; display: flex; justify-content: center;
  box-shadow: 0 8px 18px rgba(0,0,0,.3); z-index: 5;
}
.logo { height: 58px; width: auto; display: block; }

/* Écrans */
#app { flex: 1 1 auto; position: relative; min-height: 0; }
.screen {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .4s ease;
}
.screen.is-active { opacity: 1; pointer-events: auto; }
#screen-draw { justify-content: space-between; padding: 22% 20px 28px; }
#screen-result { justify-content: space-between; padding: 7% 20px 24px; overflow-y: auto; }

/* Cartes */
.card {
  width: 100%; border: 4px solid #fff; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; padding: 18px;
}
.card--back { height: 190px; background: var(--medium); color: var(--ink); }
.card--face { min-height: 170px; gap: 18px; text-align: center; }
.card--face.level-default { background: var(--blue-bar); }
.card--face.level-easy { background: var(--easy); }
.card--face.level-medium { background: var(--medium); color: var(--ink); }
.card--face.level-difficult { background: var(--difficult); }
.card__level { position: absolute; top: 6px; right: 14px; font-size: .9rem; }
.card__title { font-weight: 400; font-size: 1.1rem; }
.card__text { font-size: .9rem; line-height: 1.45; }
.card--face { gap: 14px; padding: 30px 16px 18px; }

/* QCM */
.choices { list-style: none; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.choice {
  width: 100%; text-align: left; font: inherit; font-size: .85rem; line-height: 1.35;
  color: inherit; background: rgba(255,255,255,.16);
  border: 2px solid rgba(255,255,255,.75); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; display: flex; gap: 8px;
}
.level-medium .choice { background: rgba(0,0,0,.08); border-color: rgba(0,0,0,.45); }
.choice:hover:not(:disabled) { background: rgba(255,255,255,.3); }
.level-medium .choice:hover:not(:disabled) { background: rgba(0,0,0,.16); }
.choice:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.choice:disabled { cursor: default; }
.choice.is-correct { background: #1f9d55; border-color: #fff; color: #fff; }
.choice.is-wrong { background: #d63b3b; border-color: #fff; color: #fff; }
.feedback { width: 100%; font-size: .85rem; line-height: 1.4; padding: 10px 12px; border-radius: 10px; background: rgba(10,20,50,.82); color: #fff; text-align: left; }
.feedback[hidden] { display: none; }
.card--face.flip { animation: flip .7s ease; }
@keyframes flip { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }

/* Bouton */
.btn {
  background: var(--btn); color: #06222b;
  border: 0; border-radius: 8px; padding: 14px 26px;
  font: inherit; font-size: .8rem; letter-spacing: .03em; cursor: pointer;
}
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn:active { transform: scale(.97); }

/* Mélange */
.deck { position: relative; width: 140px; height: 200px; }
.deck__card {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid #fff; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  transition: transform .45s cubic-bezier(.5, 0, .3, 1);
}
.deck__card.level-easy { background: var(--easy); }
.deck__card.level-medium { background: var(--medium); color: var(--ink); }
.deck__card.level-difficult { background: var(--difficult); }
.wait { margin-top: 110px; font-size: 1rem; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  .deck__card, .card--face.flip, .wait, .screen { transition: none; animation: none; }
}

/* Disposition côte à côte : question à gauche, propositions à droite */
.card--face.has-choices {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  grid-template-areas: "title title" "question choices" "feedback feedback";
  column-gap: 16px; row-gap: 14px; align-items: start; justify-items: stretch;
}
.has-choices .card__title { grid-area: title; text-align: center; }
.has-choices .card__text { grid-area: question; text-align: left; font-size: .85rem; }
.has-choices .choices { grid-area: choices; }
.has-choices .feedback { grid-area: feedback; }
.has-choices .choice { font-size: .8rem; padding: 9px 10px; }
@media (max-width: 330px) {
  .card--face.has-choices { grid-template-columns: 1fr; grid-template-areas: "title" "question" "choices" "feedback"; }
}

/* Catégories : défi créatif, bonus, malus */
[hidden] { display: none !important; }
.choices:empty { display: none; }
.card--face.type-defi { background: #b45309; }
.card--face.type-bonus { background: #15803d; }
.card--face.type-malus { background: #b91c1c; }
.card__num { position: absolute; top: 6px; left: 14px; font-size: .85rem; opacity: .9; }
.card__num:empty, .card__name:empty { display: none; }
.card__name { font-weight: 700; font-size: 1rem; }
.effect {
  width: 100%; text-align: left; font-size: .85rem; line-height: 1.45;
  padding: 10px 12px; border-radius: 10px; background: rgba(10,20,50,.82); color: #fff;
  display: flex; flex-direction: column; gap: 6px;
}
.btn--card { background: #fff; color: #06222b; font-weight: 600; }

</style>
</head>

  <script>
// Données des cartes (QCM).
// level : "easy" | "medium" | "difficult"   (facultatif)
// choices : exactement 3 réponses (A, B, C)
// answer : index de la bonne réponse (0 = A, 1 = B, 2 = C)
// correction : texte affiché après « Correction : X — »
// type : "defi" | "bonus" | "malus" (sinon : QCM) — n : numéro affiché sur la carte
// defi : consigne + validation (+ note) ; bonus / malus : text + effect
// Règle des défis : réussi = +75 crédits versés par la banque, non réussi = aucun gain ni perte
window.CARDS = [
  // ===== Questions d'origine, classées Easy → Medium → Difficult =====
  {  // 03 — Le bon public
    n: "03",
    level: "easy", label: "Easy", title: "CHANCE",
    question: "Une boutique vend du matériel de randonnée. Quel message correspond le mieux à son activité ?",
    choices: ["Prêts pour les sentiers", "Le goût du pain chaud", "Une nouvelle coupe de cheveux"],
    answer: 0, correction: "Prêts pour les sentiers."
  },
  {  // 05 — La bonne information
    n: "05",
    level: "easy", label: "Easy", title: "CHANCE",
    question: "Une affiche annonce un événement. Quelle information aide le public à savoir quand venir ?",
    choices: ["La couleur préférée de l’organisateur", "Le prix de fabrication de l’affiche", "La date et l’heure"],
    answer: 2, correction: "La date et l’heure."
  },
  {  // 06 — Le slogan adapté
    n: "06",
    level: "easy", label: "Easy", title: "CHANCE",
    question: "Quel slogan convient le mieux à un service de réparation de vélos ?",
    choices: ["Votre vélo reprend la route", "Des biscuits à partager", "Le sommeil en douceur"],
    answer: 0, correction: "Votre vélo reprend la route."
  },
  {  // 02 — Une publicité claire
    n: "02",
    level: "medium", label: "Medium", title: "CHANCE",
    question: "Quel message annonce le plus clairement une réduction ?",
    choices: ["Une surprise vous attend peut-être", "Nos produits sont intéressants", "−20 % sur tous les sacs aujourd’hui"],
    answer: 2, correction: "La réduction et les produits concernés sont précisés."
  },
  {  // 04 — Le logo disparaît
    n: "04",
    level: "medium", label: "Medium", title: "CHANCE",
    question: "Quel placement permet de mieux voir un logo ?",
    choices: ["Derrière une photo", "Dans une zone dégagée", "En dehors de l’affiche"],
    answer: 1, correction: "Dans une zone dégagée."
  },
  {  // 07 — Un message lisible
    n: "07",
    level: "medium", label: "Medium", title: "CHANCE",
    question: "Pour lire une affiche de loin, quel choix est le plus adapté ?",
    choices: ["Un très long texte minuscule", "Un message court écrit assez grand", "Du texte caché sous les images"],
    answer: 1, correction: "Un message court écrit assez grand."
  },
  {  // 01 — Le bon emballage
    n: "01",
    level: "difficult", label: "Difficult", title: "CHANCE",
    question: "Une marque veut que ses clients la reconnaissent sur tous ses produits. Que faut-il retrouver sur ses emballages ?",
    choices: ["Un nom différent sur chacun", "Des éléments communs, comme le nom et le logo", "Uniquement le même poids"],
    answer: 1, correction: "Des éléments communs."
  },
  {  // 08 — Une erreur à corriger
    n: "08",
    level: "difficult", label: "Difficult", title: "CHANCE",
    question: "Une marque s’appelle Nova. Son site affiche Navo par erreur. Quelle est la bonne réaction ?",
    choices: ["Changer le nom sur tous les produits sans demander", "Ne rien corriger", "Rétablir Nova sur le site"],
    answer: 2, correction: "Rétablir le bon nom."
  },

  // ===== Nouvelles questions (niveaux mélangés) =====
  {  // extra — Trop de styles
    level: "difficult", label: "Difficult", title: "CHANCE",
    question: "Une affiche mélange trois polices et sept couleurs. Quel est le principal risque ?",
    choices: ["Un message confus et une marque peu reconnaissable", "Une affiche trop légère à imprimer", "Aucun : plus il y a de styles, mieux c’est"],
    answer: 0, correction: "Un message confus et une marque peu reconnaissable."
  },
  {  // extra — Les horaires
    level: "easy", label: "Easy", title: "CHANCE",
    question: "Une boulangerie veut annoncer ses horaires. Où faut-il les afficher ?",
    choices: ["Dans un tiroir fermé", "Sur la vitrine, bien visibles", "Sur un papier jeté au sol"],
    answer: 1, correction: "Sur la vitrine, bien visibles."
  },
  {  // extra — Un avis négatif
    level: "difficult", label: "Difficult", title: "CHANCE",
    question: "Un client critique un produit sur les réseaux sociaux. Quelle réponse protège le mieux l’image de la marque ?",
    choices: ["Supprimer le commentaire sans répondre", "Répondre vite, poliment, en proposant une solution", "Répondre sèchement pour défendre la marque"],
    answer: 1, correction: "Répondre vite, poliment, en proposant une solution."
  },
  {  // extra — Se démarquer
    level: "medium", label: "Medium", title: "CHANCE",
    question: "Un restaurant veut se démarquer de ses concurrents. Que doit-il mettre en avant ?",
    choices: ["Ce que tous les autres disent déjà", "Un message vague, sans détail", "Ce qui le rend unique, comme une spécialité"],
    answer: 2, correction: "Ce qui le rend unique, comme une spécialité."
  },
  {  // extra — La bonne image
    level: "easy", label: "Easy", title: "CHANCE",
    question: "Quelle photo choisir pour promouvoir un service de jardinage ?",
    choices: ["Un jardin fleuri et bien entretenu", "Une salle de bain", "Un garage encombré"],
    answer: 0, correction: "Un jardin fleuri et bien entretenu."
  },

  <script>
document.addEventListener("DOMContentLoaded", function () {
  var CARDS = window.CARDS && window.CARDS.length ? window.CARDS
    : [{ level: "easy", label: "Easy", title: "CHANCE", text: "cards.js introuvable : vérifiez le dossier js/" }];
  const SHUFFLE_DURATION = 3000;               // durée du mélange (ms)
  const DECK_SIZE = 5;                         // cartes affichées pendant le mélange
  const LEVELS = ["easy", "medium", "difficult"];
  const LETTERS = ["A", "B", "C"];
  const $ = (id) => document.getElementById(id);
  const screens = { draw: $("screen-draw"), shuffle: $("screen-shuffle"), result: $("screen-result") };
  const deck = $("deck");
  let timer = null, interval = null;

  // --- Navigation entre écrans ---
  function show(name) {
    Object.entries(screens).forEach(([key, el]) => el.classList.toggle("is-active", key === name));
  }

  // --- Écran 2 : cartes mélangées ---
  function buildDeck() {
    deck.innerHTML = "";
    const levels = ["easy", "easy", "medium", "difficult", "difficult"];
    for (let i = 0; i < DECK_SIZE; i++) {
      const c = document.createElement("div");
      c.className = `deck__card level-${levels[i % levels.length]}`;
      c.textContent = "Chance";
      deck.appendChild(c);
    }
  }

  function scatter() {
    const rand = (min, max) => Math.random() * (max - min) + min;
    deck.querySelectorAll(".deck__card").forEach((c) => {
      c.style.transform =
        `translate(${rand(-70, 70)}px, ${rand(-90, 90)}px) rotate(${rand(-30, 30)}deg)`;
    });
  }

  function startShuffle() {
    clearTimeout(timer); clearInterval(interval);
    show("shuffle");
    buildDeck();
    setTimeout(scatter, 50);
    interval = setInterval(scatter, 450);          // les cartes bougent en continu
    timer = setTimeout(() => {
      clearInterval(interval);
      showResult();                                // fin du mélange → écran 3
    }, SHUFFLE_DURATION);
  }

  // --- Écran 3 : carte tirée (QCM, défi créatif, bonus ou malus) ---
  const RULES = window.DEFI_RULES || { success: "+75 crédits versés par la banque.", failure: "aucun gain ni perte." };

  function fillBox(box, rows) {                    // rows : [[étiquette, texte], ...]
    box.innerHTML = "";
    rows.forEach(([label, text]) => {
      const p = document.createElement("p");
      const b = document.createElement("strong");
      b.textContent = label + " : ";
      p.appendChild(b);
      p.appendChild(document.createTextNode(text));
      box.appendChild(p);
    });
  }

  function showResult() {
    const card = CARDS[Math.floor(Math.random() * CARDS.length)];
    const isQcm = !card.type && (card.choices || []).length > 0;
    const type = card.type || (isQcm ? "qcm" : "text");
    const level = LEVELS.includes(card.level) ? card.level : "default";
    const el = $("result-card");
    const list = $("result-choices");
    const feedback = $("result-feedback");
    const effect = $("result-effect");
    const reveal = $("btn-reveal");

    el.className = "card card--face " + (isQcm ? `level-${level} has-choices` : `type-${type} level-${level}`);
    $("result-num").textContent = card.n || "";
    $("result-level").textContent = card.label || "";
    $("result-title").textContent = card.title || "CHANCE";
    $("result-name").textContent = isQcm ? "" : (card.name || "");
    $("result-text").textContent = card.question || card.consigne || card.text || "";
    feedback.hidden = true; feedback.className = "feedback"; feedback.textContent = "";
    effect.hidden = true; effect.innerHTML = "";
    reveal.hidden = true;
    list.innerHTML = "";

    if (isQcm) {
      card.choices.slice(0, 3).forEach((label, i) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.innerHTML = `<b>${LETTERS[i]}.</b> <span></span>`;
        btn.lastElementChild.textContent = label;
        btn.addEventListener("click", () => answer(card, i));
        li.appendChild(btn);
        list.appendChild(li);
      });
    } else if (type === "defi") {                  // la validation s'affiche à la demande
      reveal.hidden = false;
      reveal.onclick = () => {
        const rows = [["Validation", card.validation],
                      ["Défi réussi", RULES.success],
                      ["Défi non réussi", RULES.failure]];
        if (card.note) rows.push(["À noter", card.note]);
        fillBox(effect, rows);
        effect.hidden = false;
        reveal.hidden = true;
      };
    } else if (type === "bonus" || type === "malus") {   // effet direct, sans réponse
      fillBox(effect, [["Effet", card.effect]]);
      effect.hidden = false;
    }

    show("result");
    void el.offsetWidth;                           // relance l'animation
    el.classList.add("flip");
  }

  // --- Réponse de l'utilisateur (QCM) ---
  function answer(card, picked) {
    const buttons = $("result-choices").querySelectorAll(".choice");
    const ok = picked === card.answer;
    buttons.forEach((b, i) => {
      b.disabled = true;                           // un seul choix possible
      if (i === card.answer) b.classList.add("is-correct");
      else if (i === picked) b.classList.add("is-wrong");
    });
    const feedback = $("result-feedback");
    feedback.className = "feedback " + (ok ? "ok" : "ko");
    feedback.textContent = (ok ? "Bonne réponse ! " : "Mauvaise réponse. ") +
      `Correction : ${LETTERS[card.answer]} — ${card.correction || card.choices[card.answer]}`;
    feedback.hidden = false;
  }

  $("btn-draw").addEventListener("click", startShuffle);
  $("btn-again").addEventListener("click", startShuffle);
});

</script>
